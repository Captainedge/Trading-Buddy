name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q TradingBuddy.zip
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.13, cache-disabled: true}
      - run: cd TradingBuddy && gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: TradingBuddy-APK, path: TradingBuddy/app/build/outputs/apk/release/app-release.apk}
